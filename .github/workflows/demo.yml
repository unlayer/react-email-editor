name: Demo and documentation

on:
  push:
    branches: [master]
    paths:
      - 'demo/**'
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsup.config.ts'
      - '.nvmrc'
      - '.github/workflows/ci.yml'
      - '.github/workflows/demo.yml'
  pull_request:
    paths:
      - 'demo/**'
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsup.config.ts'
      - '.nvmrc'
      - '.github/workflows/ci.yml'
      - '.github/workflows/demo.yml'

jobs:
  demo:
    name: Demo and docs (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      # The root prepare script builds the wrapper during installation.
      - run: npm ci
      - run: npm --prefix demo ci
      - run: npm --prefix demo run build
      - run: npm --prefix demo test
      - run: npm --prefix demo run test:docs
